image:
  registry: uqhacrtest.azurecr.io
  repository: backend-service-chat
  tag: "2026.40.5"
  useDigest: false
env:
  ADMIN_FRONTEND_URL: https://test-hello.azure.unique.dev/admin
  ALLOW_CONTEXT_MEMORY_WITH_WEB_SEARCH_UN_22591: "true"
  CHAT_FRONTEND_URL: https://test-hello.azure.unique.dev/chat
  CORS_ALLOWED_ORIGINS: https://test-hello.azure.unique.dev
  PGSSLMODE: require
  UNIQUE_INSTALLATION_ID: test-hello.azure.unique.dev
  ZITADEL_PROJECT_ID: "362295080381317263"
routes:
  hostname: api.test-hello.azure.unique.dev # mandatory in the chart, no routes are rendered (see defaults)
workloadIdentity:
  azure:
    enabled: true
    clientId: 1dc12421-3b16-48cd-8b25-497234379625
secretProvider:
  tenantId: aeade8c4-d4f7-4ae7-9149-4975fa3a7f91
  userAssignedIdentityID: 1f10df87-9938-4fe9-87c4-b3170f6e9611 # azurekeyvaultsecretsprovider-aks-test (client ID)
  vaults:
    hakv2test:
      AZURE_FGPT_STORAGE_CONNECTION_STRING: ingestion-storage-connection-string-1
      CHAT_LXM_ENCRYPTION_KEY: encryption-key-chat-lxm
    hakv1test:
      AZURE_OPENAI_API_ENDPOINTS_JSON: azure-openai-endpoint-definitions
postgresql:
  connection:
    url:
      fromSecretProvider:
        vault: hakv2test
        secretKey: database-url-chat
redis:
  connection:
    host:
      fromSecretProvider:
        vault: hakv2test
        secretKey: uqharedis-test-host
    port:
      fromSecretProvider:
        vault: hakv2test
        secretKey: uqharedis-test-port
    password:
      fromSecretProvider:
        vault: hakv2test
        secretKey: uqharedis-test-password
