resources:
  - apiVersion: configuration.konghq.com/v1
    kind: KongClusterPlugin
    metadata:
      name: unique-jwt-auth
      annotations:
        kubernetes.io/ingress.class: kong
    plugin: unique-jwt-auth
    config:
      algorithm: RS256
      allowed_iss:
        - https://id.test-hello.azure.unique.dev
      # Fetch JWKS from the in-cluster Zitadel service to avoid hairpinning
      # (going outside the cluster to reach Zitadel which is deployed in the same cluster).
      # The forwarded Host header keeps Zitadel's issuer/org resolution correct.
      jwks_extra_headers:
        forwarded: host=id.test-hello.azure.unique.dev
      jwks_uri: http://zitadel.unique.svc.cluster.local:8080/oauth/v2/keys
      # WebSocket tickets (release 2026.40, kong-plugins >= 2.7, `ws_ticket_enabled`,
      # `ticket_mint_path_suffixes: [/auth/ticket]`, `ticket_upgrade_path_suffixes: [/graphql]`,
      # `ticket_record_secret`, redis_*) are intentionally NOT enabled: they need a
      # Redis >= 6.2 (GETDEL) and the Azure Cache for Redis on hello-azure is 6.0 (will be upgraded to 6.2 in the future).
      # Web apps therefore keep WEBSOCKET_AUTH_MODE=token (see web-apps/_all.yaml).
      uri_param_names:
        - token
      zitadel_project_id: '362295080381317263' # needs to be updated to the correct project id (Cluster IAM project -> e.g. unique)
  - apiVersion: configuration.konghq.com/v1
    kind: KongClusterPlugin
    metadata:
      name: unique-app-repo-auth
      annotations:
        kubernetes.io/ingress.class: kong
    plugin: unique-app-repo-auth
    config:
      app_repository_url: http://backend-service-app-repository.unique.svc
  - apiVersion: configuration.konghq.com/v1
    kind: KongClusterPlugin
    metadata:
      name: unique-global-cors
      annotations:
        kubernetes.io/ingress.class: kong
      labels:
        global: "true"
    plugin: cors
    config:
      origins:
        - https://test-hello.azure.unique.dev
  - apiVersion: configuration.konghq.com/v1
    kind: KongClusterPlugin
    metadata:
      name: unique-block-route
      annotations:
        kubernetes.io/ingress.class: kong
    plugin: request-termination
    config:
      status_code: 403
      message: This route is blocked.
  - apiVersion: configuration.konghq.com/v1
    kind: KongClusterPlugin
    metadata:
      name: unique-route-metrics
      annotations:
        kubernetes.io/ingress.class: kong
    plugin: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: false