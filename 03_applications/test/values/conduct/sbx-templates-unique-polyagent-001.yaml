# SandboxTemplate + SandboxWarmPool for the Unique polyagent runtime. Every sandbox is one Kata pod from
# this template; assistants-core claims them by template name (sandboxConfig.template).
image:
  registry: uqhacrtest.azurecr.io
  repository: unique/unique-polyagent-001
  tag: "2026.40.5"
  useDigest: false

sandboxTemplate:
  name: unique-polyagent-001
  service: true
  imagePullSecrets: []
  env:
    - name: LOG_LEVEL
      value: "INFO"
    - name: HTTP_PROXY
      value: http://sbx-gateway.sbx.svc.cluster.local:3128
    - name: HTTPS_PROXY
      value: http://sbx-gateway.sbx.svc.cluster.local:3128
    - name: NO_PROXY
      value: localhost,127.0.0.1,::1
    - name: UNIQUE_API_KEY
      value: "dummy" # the gateway injects the user/company identity; the key is a placeholder for the SDK
    - name: UNIQUE_API_BASE
      value: http://backend-service-chat.unique.svc.cluster.local/public
    - name: INGESTION_UPLOAD_API_URL_INTERNAL
      value: http://backend-service-ingestion.unique.svc.cluster.local/scoped/upload
    - name: SBX_STORAGE_URL
      value: http://sbx-storage.sbx.svc.cluster.local:80
  ciliumNetworkPolicy:
    enabled: true
    description: "Egress allowlist for sandbox pods - proxy-only HTTP/HTTPS via sbx-gateway."
    enableDefaultDeny:
      ingress: true
      egress: true
    ingress:
      - fromEndpoints:
          - matchLabels:
              "k8s:io.kubernetes.pod.namespace": unique
              "k8s:app": sandbox-router
        toPorts:
          - ports:
              - port: "8888"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              "k8s:io.kubernetes.pod.namespace": kube-system
              "k8s:k8s-app": kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              "k8s:io.kubernetes.pod.namespace": sbx
              "k8s:app.kubernetes.io/name": sbx-gateway
        toPorts:
          - ports:
              - port: "3128"
                protocol: TCP
  # Warm pool: sandboxes started ahead of demand and handed to users as they open a Conduct chat.
  #
  # - Warm start: a pool sandbox is free -> the first answer arrives in seconds. The controller then
  #   starts a replacement, so the pool returns to `replicas`.
  # - Cold start: the pool is empty (more concurrent users than replicas, or replicas: 0) -> the user waits
  #   for a new sandbox: ~1 min if a Kata node has room, 3-5 min if the autoscaler first has to add a node,
  #   plus the runtime image pull on a brand-new node.
  # - Cost: ~4 sandbox pods fit on one Standard_D8s_v5. replicas: 2 keeps one Kata node permanently allocated;
  #   replicas: 0 lets the pool scale to zero nodes at the price of a cold start for the first user.
  #
  # Sizing rule of thumb: replicas = ceil(expected concurrent users / 2). Unique's tenants run 2 (starting
  # out) to 6 (busy).
  warmPool:
    enabled: true
    replicas: 2
    updateStrategy:
      type: Recreate
    # Optional: warm only during office hours, zero outside (the Kata node then goes away ~10 min later).
    # Uncomment to enable, together with the ignoreDifferences block in apps/conduct/sbx-templates.yaml
    # (KEDA then owns the replica count and Argo CD must not write it back).
    # keda:
    #   enabled: true
    #   minReplicaCount: 0
    #   triggers:
    #     cron:
    #       type: cron
    #       metadata:
    #         timezone: Europe/Zurich
    #         start: 0 7 * * 1-5
    #         end: 0 18 * * 1-5
    #         desiredReplicas: "2"

prometheus:
  enabled: false
grafana:
  dashboards:
    enabled: false
