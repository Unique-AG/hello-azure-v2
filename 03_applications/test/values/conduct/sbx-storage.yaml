# sbx-storage: checkpoint and skill-cache store for sandboxes, behind sbx-gateway.
image:
  registry: uqhacrtest.azurecr.io
  repository: unique/sbx-storage
  tag: "2026.40.5"
  useDigest: false

# The share is provisioned from the StorageClass in sbx-storage-storageclass.yaml. Size is the chart default (64Gi);
pvc:
  accessMode: ReadWriteMany
  storageClassName: sbx-backup-azurefile

nodeSelector:
  scalability: steady
  lifecycle: persistent
