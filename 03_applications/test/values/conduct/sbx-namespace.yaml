resources:
  # Sandbox pods run here, isolated from the platform namespace by CiliumNetworkPolicy.
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: sbx
      annotations:
        argocd.argoproj.io/sync-options: Prune=false

  - apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: sbx-backup-azurefile
    provisioner: file.csi.azure.com
    parameters:
      storageAccount: uqhastoragetest
      resourceGroup: resource-group-sensitive
      skuName: Standard_LRS
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    mountOptions:
      - dir_mode=0750
      - file_mode=0640
      - uid=65534
      - gid=65534
      - mfsymlinks
      - cache=strict
      - nosharesock
