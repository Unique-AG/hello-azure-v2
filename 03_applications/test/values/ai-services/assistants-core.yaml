image:
  registry: uqhacrtest.azurecr.io
  repository: ai-service-assistants-core
  tag: "2026.40.5"
  useDigest: false

env:
  CORS_ALLOWED_ORIGINS: https://test-hello.azure.unique.dev
  ZITADEL_PROJECT_ID: "362295080381317263" # needs to be updated to the correct project id (Cluster IAM project -> e.g. unique)
  UNIQUE_INSTALLATION_ID: test-hello.azure.unique.dev # the hostname of the cluster

replicaCount: 2

secretProvider:
  tenantId: aeade8c4-d4f7-4ae7-9149-4975fa3a7f91
  userAssignedIdentityID: 1f10df87-9938-4fe9-87c4-b3170f6e9611 # azurekeyvaultsecretsprovider-aks-test (client ID)
  vaults:
    hakv1test:
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT_DEFINITIONS: azure-document-intelligence-endpoint-definitions

workloadIdentity:
  azure:
    clientId: 1dc12421-3b16-48cd-8b25-497234379625 # aks-id-test

# Conduct: claim sandboxes from the sbx namespace and reach them through the agent-sandbox router.
# Renders SANDBOX_* env and a Role/RoleBinding in sbx for this service account.
sandboxConfig:
  enabled: true
  namespace: sbx
  template: unique-polyagent-001
  router:
    host:
      fromKubernetesService:
        name: agent-sandbox-controller-router-svc
        namespace: unique
        podPort: 8080
        podSelectorLabels:
          k8s:app.kubernetes.io/name: agent-sandbox-controller
          k8s:app.kubernetes.io/component: router
    port: 8080
