spec:
  name: sbx-templates-unique-polyagent-001
  autoSync: false
  # When the warm pool's KEDA cron schedule is enabled in the values (warmPool.keda), KEDA owns the pool's
  # replica count and Argo CD must stop reconciling it, or every sync writes warmPool.replicas back over
  # the schedule. Uncomment together with the keda block:
  # additionalValues:
  #   syncPolicy:
  #     syncOptions:
  #       - RespectIgnoreDifferences=true
  # ignoreDifferences:
  #   - group: extensions.agents.x-k8s.io
  #     kind: SandboxWarmPool
  #     jsonPointers:
  #       - /spec/replicas
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure-v2'
      targetRevision: main
      ref: values
    - repoURL: ghcr.io/unique-ag/helm-charts
      chart: sbx-templates
      targetRevision: "2026.44.3"
      helm:
        releaseName: unique-polyagent-001
        valueFiles:
          - $values/03_applications/test/values/conduct/sbx-templates-unique-polyagent-001.yaml
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
