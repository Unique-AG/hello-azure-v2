spec:
  name: agent-sandbox-controller
  autoSync: false
  additionalValues:
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure-v2'
      targetRevision: main
      ref: values
    - repoURL: ghcr.io/unique-ag/helm-charts
      chart: agent-sandbox-controller
      targetRevision: 1.0.1
      helm:
        releaseName: agent-sandbox-controller
        valueFiles:
          - $values/03_applications/test/values/agent-sandbox-controller/agent-sandbox-controller.yaml
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
