spec:
  name: assistants-core
  autoSync: false
  sources:
    - repoURL: 'https://github.com/Unique-AG/hello-azure-v2'
      targetRevision: main
      ref: values
    # Dedicated chart (mirrored from uniquecr like helm/chat); it carries the sandbox wiring for Conduct
    # that the generic ai-service chart does not have. Same release name and selector labels as before,
    # so the Deployment is updated in place.
    - repoURL: uqhacrtest.azurecr.io/helm
      chart: assistants-core
      targetRevision: "2026.40.5"
      helm:
        passCredentials: true
        releaseName: assistants-core
        valueFiles:
          - $values/03_applications/defaults/ai-services/assistants-core.yaml
          - $values/03_applications/test/values/ai-services/assistants-core.yaml
        valuesObject: {}
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
