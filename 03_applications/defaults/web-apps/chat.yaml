env:
  GRAPHQL_OPERATION_NAME_IN_URL_ENABLED: "false" # 2026.34: appends ?op=<operationName> to GraphQL requests (debug aid)
  MAX_HEAP_MB: 400
  NET_PROMOTER_SCORE_UI_ENABLED: "true" # 2026.36: replaces FEATURE_FLAG_NET_PROMOTER_SCORE_UI_UN_7747
  USER_API_KEY_GENERATION_ENABLED: "true" # 2026.36: replaces FEATURE_FLAG_USER_API_KEY_GENERATION_UN_11416 (keep in sync across web apps + app-repository)
nodeSelector:
  scalability: steady
  lifecycle: persistent
probes:
  liveness:
    httpGet:
      path: /chat/api/health
      port: http
    initialDelaySeconds: 5
  readiness:
    httpGet:
      path: /chat/api/health
      port: http
    initialDelaySeconds: 5
replicaCount: 2
resources:
  limits:
    cpu: 300m
    memory: 550Mi
  requests:
    cpu: 300m
    memory: 500Mi
routes:
  gateway:
    namespace: unique
  pathPrefix: /chat
  paths:
    default:
      enabled: true
    root:
      enabled: true
      redirectPath: /chat
strategy:
  type: Recreate
