env:
  ALLOW_CONTEXT_MEMORY_WITH_WEB_SEARCH_UN_22591: "false" # 2026.32: must match the value set on backend-service-chat
  GRAPHQL_OPERATION_NAME_IN_URL_ENABLED: "false" # 2026.34: appends ?op=<operationName> to GraphQL requests (debug aid)
  MAX_HEAP_MB: 350
  USER_API_KEY_GENERATION_ENABLED: "true" # 2026.36: replaces FEATURE_FLAG_USER_API_KEY_GENERATION_UN_11416 (keep in sync across web apps + app-repository)
nodeSelector:
  scalability: steady
  lifecycle: persistent
probes:
  liveness:
    httpGet:
      path: /admin/api/health
      port: http
    initialDelaySeconds: 5
  readiness:
    httpGet:
      path: /admin/api/health
      port: http
    initialDelaySeconds: 5
replicaCount: 2
resources:
  limits:
    cpu: 300m
    memory: 500Mi
  requests:
    cpu: 300m
    memory: 450Mi
routes:
  gateway:
    namespace: unique
  pathPrefix: /admin
  paths:
    default:
      enabled: true
strategy:
  type: Recreate
