env:
  ALLOW_CONTEXT_MEMORY_WITH_WEB_SEARCH_UN_22591: "false"
  GRAPHQL_OPERATION_NAME_IN_URL_ENABLED: "true"
  MAX_HEAP_MB: 350
  USER_API_KEY_GENERATION_ENABLED: "true"
nodeSelector:
  scalability: steady
  lifecycle: persistent
probes:
  liveness:
    httpGet:
      path: /admin/api/health
      port: http
    initialDelaySeconds: 5
  readiness:
    httpGet:
      path: /admin/api/health
      port: http
    initialDelaySeconds: 5
replicaCount: 2
resources:
  limits:
    cpu: 300m
    memory: 500Mi
  requests:
    cpu: 300m
    memory: 450Mi
routes:
  gateway:
    namespace: unique
  pathPrefix: /admin
  paths:
    default:
      enabled: true
strategy:
  type: Recreate
