env:
  GRAPHQL_OPERATION_NAME_IN_URL_ENABLED: "false" # 2026.34: appends ?op=<operationName> to GraphQL requests (debug aid)
  MAX_HEAP_MB: 200
  USER_API_KEY_GENERATION_ENABLED: "true" # 2026.36: replaces FEATURE_FLAG_USER_API_KEY_GENERATION_UN_11416 (keep in sync across web apps + app-repository)
nodeSelector:
  scalability: steady
  lifecycle: persistent
probes:
  liveness:
    httpGet:
      path: /theme/api/health
      port: http
    initialDelaySeconds: 5
  readiness:
    httpGet:
      path: /theme/api/health
      port: http
    initialDelaySeconds: 5
replicaCount: 2
resources:
  limits:
    cpu: 100m
    memory: 350Mi
  requests:
    cpu: 100m
    memory: 300Mi
routes:
  gateway:
    namespace: unique
  pathPrefix: /theme
  paths:
    default:
      enabled: true
strategy:
  type: Recreate
