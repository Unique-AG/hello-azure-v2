internalServices:
  dependencies:
    chat:
      name: backend-service-chat
      servicePort: 80
    configurationBackend:
      name: backend-service-configuration
      servicePort: 8095

env:
  AZURE_DOCUMENT_INTELLIGENCE_LOCATION: switzerlandnorth
  AZURE_DOCUMENT_INTELLIGENCE_API_VERSION: 2024-11-30
  CRAWL4_AI_BASE_DIRECTORY: '/tmp'
  QUARTR_API_CREDS: "unset_value" # load through .secretProvider when the Quartr integration is licensed

nodeSelector:
  scalability: steady
  lifecycle: persistent

serviceAccount:
  enabled: true

workloadIdentity:
  azure:
    enabled: true
