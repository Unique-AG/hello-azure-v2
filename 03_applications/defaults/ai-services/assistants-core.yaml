# Defaults for the dedicated assistants-core chart (uniquecr.azurecr.io/helm/assistants-core).
# The chart already carries the service defaults (API_BASE, CONFIGURATION_BACKEND_URL, Gunicorn, cache
# directories, probes, security context, /tmp volume, PDB); only what differs for this repository is here.

# Platform services as deployed by this repository: namespace unique, Service port 80 for chat.
internalServices:
  dependencies:
    chat:
      name: backend-service-chat
      servicePort: 80
    configurationBackend:
      name: backend-service-configuration
      servicePort: 8095

env:
  AZURE_DOCUMENT_INTELLIGENCE_LOCATION: switzerlandnorth
  AZURE_DOCUMENT_INTELLIGENCE_API_VERSION: 2024-11-30
  CRAWL4_AI_BASE_DIRECTORY: '/tmp'
  QUARTR_API_CREDS: "unset_value" # load through .secretProvider when the Quartr integration is licensed

nodeSelector:
  scalability: steady
  lifecycle: persistent

serviceAccount:
  enabled: true

workloadIdentity:
  azure:
    enabled: true
