env:
  AUDIT_LOG_DIR: /dev/stdout
  # Do not add CHAT_BACKEND_API_URL or SCOPE_MANAGEMENT_API_URL here — see _flags.yaml NOTES.
  LOG_LEVEL: info
  MAX_HEAP_MB: 200
  PG_DATABASE_SSL_MODE: "verify"
  SCOPE_MANAGEMENT_API_URL: http://backend-service-scope-management.unique.svc
  CHAT_BACKEND_API_URL: http://backend-service-chat.unique.svc
  NOTIFICATION_EMAIL_WORKER_ENABLED: "false"
  NOTIFICATION_PERMALINK_BASE_URL: ""
  NOTIFICATION_UNSUBSCRIBE_BASE_URL: ""
  NOTIFICATION_THROTTLE_DAILY_CAP: 5
  NOTIFICATION_THROTTLE_WEEKLY_CAP: 0
hooks:
  migration:
    enabled: true
    command: |
      cd /home/node/app/services/configuration-backend && pnpm exec prisma migrate deploy --config prisma.config.ts; cd /home/node/app/services/configuration-backend/dist; RUNNING_MODE=DATA_MIGRATION node --max-old-space-size=1000 /home/node/app/services/configuration-backend/dist/main.js;
    resources:
      requests:
        cpu: 200m
        memory: 600Mi
      limits:
        memory: 1000Mi
        cpu: 500m
replicaCount: 1
resources:
  limits:
    cpu: 100m
    memory: 350Mi
  requests:
    cpu: 100m
    memory: 300Mi
routes:
  gateway:
    namespace: unique
  pathPrefix: /configuration
  paths:
    default:
      enabled: true
    probe:
      enabled: true
service:
  port: 8095
