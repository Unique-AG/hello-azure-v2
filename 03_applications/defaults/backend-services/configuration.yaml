env:
  AUDIT_LOG_DIR: /dev/stdout
  # Do not add CHAT_BACKEND_API_URL or SCOPE_MANAGEMENT_API_URL here — see _flags.yaml NOTES.
  LOG_LEVEL: info
  MAX_HEAP_MB: 200
  PG_DATABASE_SSL_MODE: "verify"
hooks:
  migration:
    command: |
      cd /home/node/app/services/configuration-backend && pnpm exec prisma migrate deploy --config prisma.config.ts; cd /home/node/app/services/configuration-backend/dist; RUNNING_MODE=DATA_MIGRATION node /home/node/app/services/configuration-backend/dist/main.js;
    enabled: true
replicaCount: 1
resources:
  limits:
    cpu: 100m
    memory: 350Mi
  requests:
    cpu: 100m
    memory: 300Mi
routes:
  gateway:
    namespace: unique
  pathPrefix: /configuration
  paths:
    default:
      enabled: true
    probe:
      enabled: true
service:
  port: 8095
