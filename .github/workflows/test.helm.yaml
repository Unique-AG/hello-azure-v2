name: "[test][helm]"

on:
  workflow_call:
    inputs:
      file_name:
        description: The path of the file to operate on from root.
        required: true
        type: string
      action:
        description: "Helm action to perform: template, diff, sync or apply."
        default: template
        type: string
      release_name:
        description: Limit the action to one release (helmfile `-l name=<release>`); empty = all releases.
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

env:
  ARM_SUBSCRIPTION_ID: 782871a0-bcee-44fb-851f-ccd3e69ada2a
  ARM_TENANT_ID: aeade8c4-d4f7-4ae7-9149-4975fa3a7f91
  ARM_CLIENT_ID: 6d1d8c4b-9d1b-4113-a91a-dac89b2717c1 # application (client) id for the Terraform enterprise application

jobs:
  command:
    environment: 20-wl
    runs-on:
      group: ha.uq.test

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Azure Login action
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 #v2.3.0
        with:
          subscription-id: 782871a0-bcee-44fb-851f-ccd3e69ada2a
          tenant-id: aeade8c4-d4f7-4ae7-9149-4975fa3a7f91
          client-id: 6d1d8c4b-9d1b-4113-a91a-dac89b2717c1 # application (client) id for the Terraform enterprise application

      - name: Set up kubelogin
        uses: azure/use-kubelogin@76597ae0fcbaace21b05e13a2cbf8daee2c6e820 #v1.2
        with:
          kubelogin-version: v0.1.6

      - name: Get AKS context
        uses: azure/aks-set-context@feeca6405be94202afcb1c395616ff29b1811b9f #v4.0.2
        with:
          resource-group: "resource-group-core"
          cluster-name: "aks-test"
          admin: 'false'
          use-kubelogin: 'true'

      - name: Setup Helm
        uses: mamezou-tech/setup-helmfile@fd46979d2984c886929c416fbdf859b1c5efa0ea #v2.1.0
        # todo: do we need to pin dependencies? the pinned sha above uses versioned dependencies at least

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 #v4.0.0
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - name: "🔍 Helm Template"
        if: inputs.action == 'template'
        env:
          FILE_NAME: ${{ inputs.file_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          helmfile -e test -f "$FILE_NAME" ${RELEASE_NAME:+-l "name=$RELEASE_NAME"} template

      - name: "🪞 Helm Diff"
        if: inputs.action == 'diff'
        env:
          FILE_NAME: ${{ inputs.file_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          helmfile -e test -f "$FILE_NAME" --concurrency 4 ${RELEASE_NAME:+-l "name=$RELEASE_NAME"} diff

      - name: "🚀 Helm Apply/Sync"
        if: inputs.action == 'apply' || inputs.action == 'sync'
        env:
          FILE_NAME: ${{ inputs.file_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          helmfile -e test -f "$FILE_NAME" ${RELEASE_NAME:+-l "name=$RELEASE_NAME"} sync
